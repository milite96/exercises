<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar</title>
    <link
      rel="shortcut icon"
      href="https://img.icons8.com/ios-glyphs/30/pinguin--v1.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <nav>
      <img
        class="hamburger-menu"
        src="assets\icons8-hamburger-menu-50.png"
        alt="hamburger-menu"
      />
      <h1>Navbar</h1>
      <ul>
        <li>Home</li>
        <li><a href="#">Link</a></li>
        <li>
          <select name="Dropdown" id="">
            <option>Dropdown</option>
          </select>
        </li>
        <li><button disabled>Disabled</button></li>
      </ul>
      <form class="search-container" action="#">
        <input class="form-input" type="search" placeholder="Search" />
        <button class="search-button-container">
          <img class="search-icon" src="assets\icons8-search-50.png" alt="" />
          <p class="search-text">Search</p>
        </button>
      </form>
    </nav>
  </body>
</html>
