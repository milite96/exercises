<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 6</title>
    <link
      rel="shortcut icon"
      href="https://img.icons8.com/ios-glyphs/30/pinguin--v1.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="calculator">
      <section class="result-container">
        <div class="result">0</div>
      </section>
      <section class="grid-buttons">
        <button class="disable-border-left disable-border-top operators">
          +
        </button>
        <button class="disable-border-top operators">-</button>
        <button class="disable-border-top operators">×</button>
        <button class="disable-border-top disable-border-right operators">
          ÷
        </button>
        <button class="disable-border-left">7</button>
        <button>8</button>
        <button>9</button>
        <button class="equal-sign">=</button>
        <button class="disable-border-left">4</button>
        <button>5</button>
        <button>6</button>
        <button class="disable-border-left">1</button>
        <button>2</button>
        <button>3</button>
        <button class="disable-border-left disable-border-bottom">0</button>
        <button class="disable-border-bottom">.</button>
        <button class="disable-border-bottom">AC</button>
      </section>
    </section>
  </body>
</html>
