<html>

<body>
  <div id="container" style="display: flex; flex-direction: column; align-items: center"></div>
</body>

</html>

<script>
  const container = document.getElementById("container");

  async function fetchApi() {
    const fetchData = await fetch("https://jsonplaceholder.typicode.com/todos");
    const toDos = await fetchData.json();

    return toDos;
  }

  function printTodo(array) {
    console.log(array);
    const ul = document.createElement("ul");
    array.forEach((element) => {
      const li = document.createElement("li");
      li.textContent = element.title;
      ul.appendChild(li);
    });

    container.appendChild(ul);
  }

  fetchApi()
    .then((toDos) => printTodo(toDos))
    .catch((err) => {
      console.log(err, "el fetch falló");
    });
</script>
