<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
</head>

<body>
  <div id="container">
    <form>
      <div>
        <label>First Name:</label>
        <input type="text" class="form-input" id="firstName" value="Mario" />
      </div>
      <div>
        <label>Last Name:</label>
        <input type="text" class="form-input" id="lastName" value="Rossi" />
      </div>
      <div>
        <label>Age:</label>
        <input type="number" class="form-input" id="age" value="25" />
      </div>
    </form>
  </div>
</body>

</html>


<script>
  const getInputValues = document.querySelectorAll(".form-input");
  const getLabelValues = document.getElementsByTagName("label");

  for (let i = 0; i < getInputValues.length; i++) {
    console.log(`${getLabelValues[i].innerText} ${getInputValues[i].value}`);
  }
</script>
