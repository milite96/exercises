<html>
  <body>
    <div id="container">
      <form>
        <div>
          <label for="post-title">Title</label>
          <input type="text" id="post-title" onchange="changeInput(event)"/>
        </div>
        <div>
          <label for="todo-completed">Completed</label>
          <input type="checkbox" id="todo-completed" onchange="toggleCompleted()"/>
        </div>

        <button type="button" id="submit-todo" onclick="postData(postTitle, isCompleted)">Post!</button>
      </form>
    </div>

      <script src="postRequest.js"></script>
  </body>
</html>
